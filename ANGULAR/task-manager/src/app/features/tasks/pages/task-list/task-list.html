<div class="flex justify-between items-center mb-4">
  <h2 class="text-xl font-bold">Task List</h2>

  <button class="bg-blue-500 text-white px-4 py-2 rounded" (click)="isFormOpen = true">
    Add Task
  </button>
</div>

<app-task-table [tasks]="tasks"></app-task-table>

@if (isFormOpen) {
  <app-task-form (closeForm)="isFormOpen = false"></app-task-form>
}
